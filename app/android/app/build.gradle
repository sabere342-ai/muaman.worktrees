plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.itech.storemanagement"
    // Phase P (Android productization): compileSdk 36 required to compile
    // against target API 36 (Owner decision TARGET_API_36; Play target-API
    // expectations). Build-time only.
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // Phase Q (PD-K1): final owner-locked applicationId (group A / phase Q
        // owner identity decision). namespace MUST equal applicationId.
        applicationId = "com.itech.storemanagement"
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        // Phase K (D11): frozen Android baseline from ARCHITECTURE_PLAN §13.
        minSdk = 21
        // Phase P (Android productization): Owner decision resolved targetSdk
        // to API 36 for Google Play target-API compliance. minSdk stays 21.
        targetSdk = 36
    }

    buildTypes {
        release {
            // Phase Q (PD-K2): production (upload) signing is provided by the
            // fail-closed DPAPI-backed helper below. No debug fallback.
        }
    }
}

flutter {
    source = "../.."
}

// Phase Q (PD-K2): owner upload-key release signing configuration.
// Replaces the development-only debug release fallback; fails closed unless
// the reconciliation-locked signing material verifies exactly.
apply from: "$rootDir/gradle/production-signing.gradle"

dependencies {
    // Phase K (D7): Keystore-backed EncryptedSharedPreferences backing the
    // itech.app/secure_storage method channel (GA6 platform-channel option).
    implementation "androidx.security:security-crypto:1.0.0"
}
