plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.almuaman.muaman_store"
    // Phase K: compileSdk 35 is required by current plugin toolchains
    // (flutter_plugin_android_lifecycle). Build-time only — targetSdk stays
    // frozen at 34 (D11) and runtime behavior is unchanged.
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // Phase K (OD-K1 placeholder): final applicationId/label decision is
        // pending owner decision; this placeholder is retained until then.
        applicationId = "com.almuaman.muaman_store"
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        // Phase K (D11): frozen Android baseline from ARCHITECTURE_PLAN §13.
        minSdk = 21
        targetSdk = 34
    }

    buildTypes {
        release {
            // Phase K (OD-K2): release signing ownership is a pending owner
            // decision; debug-signed release remains the documented
            // placeholder for development builds only.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Phase K (D7): Keystore-backed EncryptedSharedPreferences backing the
    // itech.app/secure_storage method channel (GA6 platform-channel option).
    implementation "androidx.security:security-crypto:1.0.0"
}
